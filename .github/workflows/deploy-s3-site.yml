name: Deploy S3 Site

on:
  workflow_call:
    inputs:
      source-directory:
        description: "Directory containing the built site files"
        type: string
        required: true
      s3-destination:
        description: "S3 bucket URI (e.g. s3://my-bucket)"
        type: string
        required: true
      cloudfront-distribution-id:
        description: "CloudFront distribution ID to invalidate"
        type: string
        default: ""
      aws-region:
        description: "AWS region"
        type: string
        default: "ap-southeast-1"
      delete-removed:
        description: >-
          Pass --delete to aws s3 sync, removing objects in the destination that
          are not in the source. Defaults to false (BEHAVIOR CHANGE from earlier
          versions, which always deleted). Combine with include-filters so only
          intended keys are ever deleted.
        type: boolean
        default: false
      include-filters:
        description: >-
          Optional allowlist, one aws s3 sync include pattern per line. When set,
          everything is excluded except the listed patterns, and --delete (if
          enabled) only touches matching keys.
        type: string
        default: ""
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: "ARN of the IAM role to assume via OIDC"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync to S3
        env:
          SRC: ${{ inputs.source-directory }}
          DEST: ${{ inputs.s3-destination }}
          DELETE_REMOVED: ${{ inputs.delete-removed }}
          INCLUDE_FILTERS: ${{ inputs.include-filters }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$INCLUDE_FILTERS" ]; then
            args+=(--exclude "*")
            mapfile -t patterns <<< "$INCLUDE_FILTERS"
            for p in "${patterns[@]}"; do
              [ -n "$p" ] && args+=(--include "$p")
            done
          fi
          if [ "$DELETE_REMOVED" = "true" ]; then
            args+=(--delete)
          fi
          aws s3 sync "$SRC" "$DEST" "${args[@]}"

      - name: Invalidate CloudFront cache
        if: inputs.cloudfront-distribution-id != ''
        env:
          DISTRIBUTION_ID: ${{ inputs.cloudfront-distribution-id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
