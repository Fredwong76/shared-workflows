name: Deploy S3 Site

on:
  workflow_call:
    inputs:
      source-directory:
        description: "Directory containing the built site files"
        type: string
        required: true
      s3-destination:
        description: "S3 bucket URI (e.g. s3://my-bucket)"
        type: string
        required: true
      cloudfront-distribution-id:
        description: "CloudFront distribution ID to invalidate"
        type: string
        default: ""
      aws-region:
        description: "AWS region"
        type: string
        default: "ap-southeast-1"
      delete-removed:
        description: "Pass --delete to remove destination objects not present in source. Destructive; default off."
        type: boolean
        default: false
      include-filters:
        description: "Optional allowlist. When set, sync uses --exclude '*' then these --include patterns (space-separated, each quoted). Only matching files are synced; everything else in the destination is left untouched. Leave empty to sync the whole source-directory."
        type: string
        default: ""
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: "ARN of the IAM role to assume via OIDC"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync to S3
        env:
          SRC: ${{ inputs.source-directory }}
          DEST: ${{ inputs.s3-destination }}
          DELETE_FLAG: ${{ inputs.delete-removed && '--delete' || '' }}
          INCLUDE_FILTERS: ${{ inputs.include-filters }}
        run: |
          if [ -n "$INCLUDE_FILTERS" ]; then
            # Allowlist mode: exclude everything, then re-include only the named patterns.
            # Parse INCLUDE_FILTERS into a bash array via eval so each quoted pattern
            # becomes a SEPARATE argument WITHOUT its surrounding quotes. A bare
            # unquoted "$INCLUDE_FILTERS" word-splits but leaves the literal " chars in
            # each pattern (e.g. --include '"about.html"'), which matches no file and
            # silently uploads nothing while still exiting 0.
            echo "Allowlist sync. Filters: $INCLUDE_FILTERS"
            eval "FILTER_ARGS=($INCLUDE_FILTERS)"
            aws s3 sync "$SRC" "$DEST" $DELETE_FLAG --exclude "*" "${FILTER_ARGS[@]}"
          else
            echo "Full-directory sync."
            aws s3 sync "$SRC" "$DEST" $DELETE_FLAG
          fi

      - name: Invalidate CloudFront cache
        if: inputs.cloudfront-distribution-id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ inputs.cloudfront-distribution-id }} \
            --paths "/*"
