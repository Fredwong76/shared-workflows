name: Monitor Kiro

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      scripts-directory:
        description: "Directory containing fetch/classify/report scripts"
        type: string
        default: "scripts"
      reports-directory:
        description: "Directory to write generated reports"
        type: string
        default: "reports"
      install-command:
        description: "Command to install dependencies"
        type: string
        default: "pip install -r requirements.txt"
    secrets:
      KIRO_MONITOR_API_KEY:
        description: "API key for classification service"
        required: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Fetch feeds
        run: python ${{ inputs.scripts-directory }}/fetch_feeds.py

      - name: Classify entries
        env:
          KIRO_MONITOR_API_KEY: ${{ secrets.KIRO_MONITOR_API_KEY }}
        run: python ${{ inputs.scripts-directory }}/classify_entries.py

      - name: Generate report
        run: python ${{ inputs.scripts-directory }}/generate_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.reports-directory }}/
          git diff --staged --quiet || git commit -m "chore: daily monitoring report $(date +%Y-%m-%d)"
          git push
