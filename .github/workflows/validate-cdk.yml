name: Validate CDK

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      cdk-directory:
        description: "Directory containing the CDK app"
        type: string
        default: "cdk"
      install-command:
        description: "Command to install CDK dependencies"
        type: string
        default: "pip install -r requirements.txt"
      run-tests:
        description: "Run CDK stack tests (pytest) from the cdk directory after synth"
        type: boolean
        default: false
      test-install-command:
        description: "Command to install test dependencies (e.g. pytest, dev requirements)"
        type: string
        default: "pip install -r requirements.txt -r requirements-dev.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        working-directory: ${{ inputs.cdk-directory }}
        run: ${{ inputs.install-command }}

      - name: CDK Synth (validate templates)
        working-directory: ${{ inputs.cdk-directory }}
        run: cdk synth --no-bundling --quiet

      - name: Install test dependencies
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.cdk-directory }}
        run: ${{ inputs.test-install-command }}

      - name: Run CDK stack tests
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.cdk-directory }}
        run: python -m pytest tests/ --tb=short -q
