name: Validate CDK

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      node-version:
        description: "Node.js version used to run the CDK CLI"
        type: string
        default: "24"
      cdk-version:
        description: "Pinned aws-cdk CLI version (bumped by canonical releases)"
        type: string
        default: "2.1148.0"
      cdk-directory:
        description: "Directory containing the CDK app"
        type: string
        default: "cdk"
      install-command:
        description: "Command to install CDK dependencies"
        type: string
        default: "pip install -r requirements.txt"
      run-tests:
        description: "Run CDK stack tests (pytest) from the cdk directory after synth"
        type: boolean
        default: false
      test-install-command:
        description: "Command to install test dependencies (e.g. pytest, dev requirements)"
        type: string
        default: "pip install -r requirements.txt -r requirements-dev.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install AWS CDK CLI
        env:
          CDK_VERSION: ${{ inputs.cdk-version }}
        run: npm install -g "aws-cdk@${CDK_VERSION}"

      - name: Install CDK dependencies
        working-directory: ${{ inputs.cdk-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: eval "$INSTALL_COMMAND"

      - name: CDK Synth (validate templates)
        working-directory: ${{ inputs.cdk-directory }}
        run: cdk synth --no-bundling --quiet

      - name: Install test dependencies
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.cdk-directory }}
        env:
          TEST_INSTALL_COMMAND: ${{ inputs.test-install-command }}
        run: eval "$TEST_INSTALL_COMMAND"

      - name: Run CDK stack tests
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.cdk-directory }}
        run: python -m pytest tests/ --tb=short -q
