name: CI - Python Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      test-path:
        description: "Path to test directory or file"
        type: string
        default: "tests/"
      install-command:
        description: "Command to install dependencies"
        type: string
        default: "pip install -r requirements.txt"
      working-directory:
        description: "Working directory for the project"
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: eval "$INSTALL_COMMAND"

      - name: Run tests
        env:
          TEST_PATH: ${{ inputs.test-path }}
        run: |
          # shellcheck disable=SC2086  # test-path may hold several space-separated paths
          python -m pytest $TEST_PATH --tb=short -q
